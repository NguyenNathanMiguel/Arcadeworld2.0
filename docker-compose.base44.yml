services:
  web:
    image: node:22-bookworm-slim
    working_dir: /app
    init: true
    command: sh -c "npm ci --no-audit --no-fund && node --watch server.js"
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  node_modules:
